<!-- Both typefaces are served from this origin, never from Google Fonts (CI
     fails on that host name anywhere in this file, comments included):
     an external font request would hand the visitor's IP to a third party and
     cost the site its consent-free operation. All three files are preloaded:
     each is on screen in the first viewport, and without the hint the browser
     only finds them once it has parsed the CSS that asks for them, which is one
     swap-flash per file. Keep this list and the @font-face rules below in step;
     a preload nobody uses is a wasted download. -->
<link rel="preload" href="/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* IBM Plex Mono and IBM Plex Sans — © 2017 IBM Corp., Reserved Font Name
     "Plex", https://github.com/IBM/plex
     SIL Open Font License 1.1, shipped alongside at /fonts/OFL-IBMPlex.txt.
     IBM's own Latin1 split files, unmodified (the Reserved Font Name rules out
     subsetting them ourselves); see fonts/README.md. */
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("/fonts/ibm-plex-mono-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "IBM Plex Mono";
    src: url("/fonts/ibm-plex-mono-600.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "IBM Plex Sans";
    src: url("/fonts/ibm-plex-sans-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  /* Tokens from the pklnx.space design system (Carbon v11, G100 theme),
     under their Carbon names and values. Only the ones this page uses. */
  :root {
    --background:         #161616;
    --background-hover:   rgba(141, 141, 141, 0.16);  /* service row hover */
    --border-subtle-00:   #393939;  /* rules: header, footer, service list */
    --text-primary:       #f4f4f4;  /* wordmark, service names, prompt */
    --text-secondary:     #c6c6c6;  /* every dimmed text, 12 px included: 10.6:1 */
    --link-primary:       #be95ff;  /* host links: 7.7:1 */
    --link-primary-hover: #d4bbff;
    --focus:              #ffffff;
    --star:               #a56eff;  /* the star, the $ sigil; never a control */

    --spacing-02: 0.25rem;
    --spacing-03: 0.5rem;
    --spacing-04: 0.75rem;
    --spacing-05: 1rem;
    --spacing-06: 1.5rem;
    --spacing-07: 2rem;
    --spacing-09: 3rem;
    --spacing-10: 4rem;
    --spacing-11: 5rem;

    /* Carbon's stacks: the self-hosted faces first, system fonts behind them
       for the moment before they load (font-display: swap). */
    --font-mono: "IBM Plex Mono", "Menlo", "DejaVu Sans Mono",
                 "Bitstream Vera Sans Mono", Courier, monospace;
    --font-sans: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont,
                 ".SFNSText-Regular", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: var(--spacing-09);
    padding: var(--spacing-07) var(--spacing-05);
    background: var(--background);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 1rem;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  /* Carbon's grid: 16 px page margin on a phone, 32 px from the md breakpoint. */
  @media (min-width: 42rem) {
    body { padding: var(--spacing-09) var(--spacing-07); }
  }

  a { color: inherit; text-decoration: none; }

  /* Carbon focus: 2 px inside, white on the dark theme. */
  a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: -2px;
  }

  /* Grid items default to min-width: auto, so a single unbreakable row — the
     eyebrow below is the long one — would widen the whole page and hand the
     phone a horizontal scrollbar. */
  header, main, footer { min-width: 0; }

  /* Every logo path takes its color from here, so the tokens stay the single
     source. Text and bracket in text-primary, the star in star. */
  .ink  { fill: var(--text-primary); }
  .star { fill: var(--star); }

  /* --- Header ------------------------------------------------------------ */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-06);
    padding-bottom: var(--spacing-05);
    border-bottom: 1px solid var(--border-subtle-00);
  }

  .mark { display: block; width: 32px; height: 32px; }

  /* label-01 */
  .eyebrow {
    font-size: 0.75rem;
    line-height: 1.33333;
    letter-spacing: 0.32px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  /* Next to the mark on a phone the eyebrow is a squeeze, and the tagline two
     rows below says the same thing, so dropping it there costs nothing. */
  @media (max-width: 40rem) {
    .eyebrow { display: none; }
  }

  /* --- Main --------------------------------------------------------------- */

  main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--spacing-10);
    max-width: 50rem;
  }

  @media (min-width: 42rem) {
    main { gap: var(--spacing-11); }
  }

  .hero { display: flex; flex-direction: column; gap: var(--spacing-07); }

  h1 { margin: 0; line-height: 0; }

  /* The wordmark is the logo itself, drawn as paths, so it looks the same
     whether or not the webfont has arrived. It scales with the viewport and
     stops at 786 px, where it already fills a laptop's first screen. */
  .wordmark {
    display: block;
    width: clamp(269px, 74vw, 786px);
    max-width: 100%;
    height: auto;
  }

  /* body-02 */
  .tagline {
    margin: 0;
    max-width: 68ch;
    color: var(--text-secondary);
    text-wrap: pretty;
  }

  /* --- Services ----------------------------------------------------------- */

  .services { display: flex; flex-direction: column; gap: var(--spacing-05); }

  /* The design system's prompt style; its smaller step on a phone. */
  .prompt {
    display: flex;
    align-items: baseline;
    gap: var(--spacing-04);
    margin: 0;
    font-family: var(--font-mono);
    font-size: 1.75rem;
    line-height: 1.28572;
    font-weight: 600;
  }
  .prompt .sigil { color: var(--star); }

  @media (max-width: 40rem) {
    .prompt { font-size: 1.25rem; line-height: 1.4; }
  }

  .list {
    display: flex;
    flex-direction: column;
    padding-left: var(--spacing-06);
    border-left: 1px solid var(--border-subtle-00);
  }

  .service {
    display: flex;
    flex-wrap: wrap;
    column-gap: var(--spacing-06);
    row-gap: var(--spacing-02);
    align-items: baseline;
    padding: var(--spacing-04);
    margin-left: calc(-1 * var(--spacing-04));
    border-bottom: 1px solid var(--border-subtle-00);
    font-size: 0.875rem;
    line-height: 1.42857;
  }

  .service:hover { background: var(--background-hover); }

  /* Name and host are names of machines, so mono (code-02); the role is
     language, so sans (body-01). */
  .service .name {
    min-width: 12ch;
    font-family: var(--font-mono);
    font-weight: 600;
    letter-spacing: 0.32px;
  }

  .service .role {
    flex: 1 1 12ch;
    letter-spacing: 0.16px;
    color: var(--text-secondary);
  }

  .service .host {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-03);
    font-family: var(--font-mono);
    letter-spacing: 0.32px;
    color: var(--link-primary);
  }

  .service:hover .host {
    color: var(--link-primary-hover);
    text-decoration: underline;
  }

  /* Carbon icon (Launch), 16 px next to text, filled in currentColor. */
  .icon {
    flex: none;
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  /* --- Footer ------------------------------------------------------------- */

  /* code-01: the footer only holds the host name. */
  footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: var(--spacing-06);
    padding-top: var(--spacing-05);
    border-top: 1px solid var(--border-subtle-00);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    line-height: 1.33333;
    letter-spacing: 0.32px;
    color: var(--text-secondary);
  }
</style>
</head>
