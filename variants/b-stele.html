<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pklnx</title>
<meta name="description" content="pklnx — infrastructure &amp; backend engineering">
<meta name="theme-color" content="#0b0b0d">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0b0d'/%3E%3Crect x='7' y='15' width='18' height='2' fill='%23b99a5b'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:     #0b0b0d;
    --fg:     #ececed;
    --muted:  #8e9095;
    --accent: #b99a5b;

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "DejaVu Sans Mono", "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(2rem, 7vw, 4rem);
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    line-height: 1.6;
    text-align: center;
    -webkit-text-size-adjust: 100%;
    animation: settle 1s ease-out both;
  }

  @keyframes settle {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
  }

  /* main nimmt den Raum oberhalb des Footers ein und zentriert darin — so sitzt
     der Block wirklich mittig, statt dass zwei auto-Margins gegeneinander laufen */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    max-width: 40rem;
    padding-bottom: clamp(2rem, 8vh, 4rem);
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 400;
    letter-spacing: .34em;
    /* letter-spacing haengt rechts nach — optisch ausgleichen */
    text-indent: .34em;
    line-height: 1.2;
  }

  .tagline {
    margin: 1.1rem 0 0;
    color: var(--muted);
    font-size: clamp(.8125rem, 2.5vw, .9375rem);
    letter-spacing: .08em;
  }

  /* Schlusspunkt unter der Tagline, kein Trenner */
  .rule {
    width: clamp(2.5rem, 10vw, 4rem);
    height: 1px;
    margin: clamp(2rem, 7vh, 3.25rem) auto 0;
    border: 0;
    background: var(--accent);
    opacity: .55;
  }

  footer {
    color: var(--muted);
    font-size: .75rem;
    letter-spacing: .18em;
    text-indent: .18em;
  }
</style>
</head>
<body>

<main>
  <h1>pklnx</h1>
  <p class="tagline">infrastructure &amp; backend engineering</p>
  <hr class="rule">
</main>

<footer>pklnx.space</footer>

</body>
</html>
