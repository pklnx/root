<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pklnx</title>
<meta name="description" content="pklnx — infrastructure &amp; cloud engineering">
<meta name="theme-color" content="#08080a">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2308080a'/%3E%3Crect x='8' y='8' width='16' height='16' fill='none' stroke='%23ff4b33' stroke-width='2'/%3E%3C/svg%3E">

<!-- The typeface is served from this origin, never from fonts.googleapis.com:
     an external font request would hand the visitor's IP to a third party and
     cost the site its consent-free operation. All three weights are preloaded:
     every one of them is on screen in the first viewport, and without the hint
     the browser only finds them once it has parsed the CSS that asks for them —
     which is one swap-flash per weight. Keep this list and the @font-face rules
     below in step; a preload nobody uses is a wasted download. -->
<link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jetbrains-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jetbrains-mono-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* JetBrains Mono — © 2020 The JetBrains Mono Project Authors,
     https://github.com/JetBrains/JetBrainsMono
     SIL Open Font License 1.1, shipped alongside at /fonts/OFL.txt.
     Self-hosted, latin subset; see fonts/README.md for version and provenance. */
  @font-face {
    font-family: "JetBrains Mono";
    src: url("/fonts/jetbrains-mono-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "JetBrains Mono";
    src: url("/fonts/jetbrains-mono-500.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "JetBrains Mono";
    src: url("/fonts/jetbrains-mono-700.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg:        #08080a;
    --fg:        #d9d4c8;
    --bright:    #f4f1ea;
    --dim:       #a49f97;
    --muted:     #918b82;  /* the dimmest tone, and the one on 12 px text: 5.9:1 */
    --accent:    #ff4b33;
    --rule:      #1c1c20;
    --rule-soft: #141418;
    --hover:     #0e0e12;

    /* The self-hosted face first, a system monospace stack behind it for the
       moment before it loads (font-display: swap) and for the rare browser
       that refuses woff2. */
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo,
            Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 40px;
    padding: 5vh 6vw;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }

  a { color: inherit; text-decoration: none; }

  /* Grid items default to min-width: auto, so a single unbreakable row — the
     eyebrow below is the long one — would widen the whole page and hand the
     phone a horizontal scrollbar. */
  header, main, footer { min-width: 0; }

  /* --- Header ------------------------------------------------------------ */

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }

  .wordmark { font-weight: 700; color: var(--bright); }

  .eyebrow {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .12em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Tracked-out uppercase does not fit next to the wordmark on a phone, and
     breaking it over two lines looks like an accident. The tagline two rows
     below says the same thing, so dropping it there costs nothing. */
  @media (max-width: 40rem) {
    .eyebrow { display: none; }
  }

  /* --- Main --------------------------------------------------------------- */

  main {
    display: flex;
    flex-direction: column;
    gap: 56px;
    max-width: 76ch;
  }

  .hero { display: flex; flex-direction: column; gap: 20px; }

  h1 {
    margin: 0;
    font-weight: 700;
    font-size: clamp(48px, 12vw, 120px);
    line-height: 1;
    letter-spacing: -.04em;
    color: var(--bright);
  }

  /* Terminal caret next to the wordmark — a block, not a glyph, so it needs no
     character from the font and cannot shift the baseline. */
  .caret {
    display: inline-block;
    width: .42em;
    height: .86em;
    margin-left: .12em;
    vertical-align: -.06em;
    background: var(--accent);
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* A blinking element is exactly what this preference is meant to stop. */
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
  }

  .tagline {
    margin: 0;
    max-width: 52ch;
    color: var(--dim);
    font-size: clamp(15px, 1.8vw, 18px);
    text-wrap: pretty;
  }

  /* --- Services ----------------------------------------------------------- */

  .services { display: flex; flex-direction: column; gap: 22px; }

  .prompt { display: flex; align-items: baseline; gap: 12px; }
  .prompt .sigil { color: var(--accent); font-weight: 500; }
  .prompt .command { color: var(--bright); }

  .list {
    display: flex;
    flex-direction: column;
    padding-left: 26px;
    border-left: 1px solid var(--rule);
  }

  .service {
    display: flex;
    flex-wrap: wrap;
    column-gap: 24px;
    row-gap: 4px;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid var(--rule-soft);
  }

  .service:hover { background: var(--hover); }

  .service .name { min-width: 12ch; color: var(--bright); }
  .service .role { flex: 1 1 12ch; color: var(--muted); }

  .service .host {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--accent);
  }

  /* --- Footer ------------------------------------------------------------- */

  footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <span class="wordmark">pklnx</span>
  <!-- Hidden from assistive technology: it repeats the tagline two rows below
       word for word, and a screen reader would read the line out twice. -->
  <span class="eyebrow" aria-hidden="true">infrastructure &amp; cloud engineering</span>
</header>

<main>

  <section class="hero">
    <h1>pklnx<span class="caret"></span></h1>
    <p class="tagline">infrastructure &amp; cloud engineering.</p>
  </section>

  <section class="services">
    <div class="prompt">
      <span class="sigil">$</span>
      <span class="command">ls ./services</span>
    </div>
    <div class="list">
      <a class="service" href="https://hermes.pklnx.space">
        <span class="name">hermes</span>
        <span class="role">mail server</span>
        <span class="host">hermes.pklnx.space →</span>
      </a>
    </div>
  </section>

</main>

<footer>
  <span>pklnx.space</span>
</footer>

</body>
</html>
