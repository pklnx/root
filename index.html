<!-- Both typefaces are served from this origin, never from Google Fonts (CI
     fails on that host name anywhere in this file, comments included):
     an external font request would hand the visitor's IP to a third party and
     cost the site its consent-free operation. All three files are preloaded:
     each is on screen in the first viewport, and without the hint the browser
     only finds them once it has parsed the CSS that asks for them, which is one
     swap-flash per file. Keep this list and the @font-face rules below in step;
     a preload nobody uses is a wasted download. -->
<link rel="preload" href="/fonts/space-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/space-mono-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Space Mono — © 2016 The Space Mono Project Authors,
     https://github.com/googlefonts/spacemono
     SIL Open Font License 1.1, shipped alongside at /fonts/OFL-SpaceMono.txt.
     Self-hosted, latin subset; see fonts/README.md for version and provenance. */
  @font-face {
    font-family: "Space Mono";
    src: url("/fonts/space-mono-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Space Mono";
    src: url("/fonts/space-mono-700.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  /* IBM Plex Sans — © 2017 IBM Corp., Reserved Font Name "Plex",
     https://github.com/IBM/plex
     SIL Open Font License 1.1, shipped alongside at /fonts/OFL-IBMPlex.txt.
     IBM's own Latin1 split file, unmodified (the Reserved Font Name rules out
     subsetting it ourselves); see fonts/README.md. */
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("/fonts/ibm-plex-sans-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  /* Tokens from the pklnx.space design system, dark theme. */
  :root {
    --ground:    #08080a;
    --surface:   #111114;  /* row hover */
    --line:      #2c2c31;  /* rules: header, footer, service list */
    --line-soft: #1a1a1e;  /* separators between service rows */
    --ink:       #f3f1ec;  /* wordmark, service names, prompt */
    --ink-muted: #a3a09a;  /* every dimmed text, 12 px included: 7.7:1 */
    --star:      #ff5a36;  /* the star, the $ sigil */
    --star-ink:  #ff7a5c;  /* the accent as text: host links, 7.8:1 */

    /* The self-hosted faces first, system stacks behind them for the moment
       before they load (font-display: swap) and for a browser without woff2. */
    --mono: "Space Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo,
            Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 48px;
    padding: 5vh 6vw;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  a { color: inherit; text-decoration: none; }

  a:focus-visible {
    outline: 2px solid var(--star);
    outline-offset: 4px;
  }

  /* Grid items default to min-width: auto, so a single unbreakable row — the
     eyebrow below is the long one — would widen the whole page and hand the
     phone a horizontal scrollbar. */
  header, main, footer { min-width: 0; }

  /* Every logo path takes its color from here, so the tokens stay the single
     source. Text and bracket in ink, the star in star. */
  .ink  { fill: var(--ink); }
  .star { fill: var(--star); }

  /* --- Header ------------------------------------------------------------ */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .mark { display: block; width: 32px; height: 32px; }

  .eyebrow {
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: .12em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Tracked-out uppercase does not fit next to the mark on a phone, and
     breaking it over two lines looks like an accident. The tagline two rows
     below says the same thing, so dropping it there costs nothing. */
  @media (max-width: 40rem) {
    .eyebrow { display: none; }
  }

  /* --- Main --------------------------------------------------------------- */

  main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 64px;
    max-width: 80ch;
  }

  .hero { display: flex; flex-direction: column; gap: 28px; }

  h1 { margin: 0; line-height: 0; }

  /* The wordmark is the logo itself, drawn as paths, so it looks the same
     whether or not the webfont has arrived. It scales with the viewport and
     stops at 760 px, where it already fills a laptop's first screen. */
  .wordmark {
    display: block;
    width: clamp(260px, 72vw, 760px);
    max-width: 100%;
    height: auto;
  }

  .tagline {
    margin: 0;
    max-width: 52ch;
    font-family: var(--sans);
    font-size: clamp(16px, 1.8vw, 19px);
    line-height: 1.6;
    color: var(--ink-muted);
    text-wrap: pretty;
  }

  /* --- Services ----------------------------------------------------------- */

  .services { display: flex; flex-direction: column; gap: 20px; }

  .prompt {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .prompt .sigil { color: var(--star); }

  .list {
    display: flex;
    flex-direction: column;
    padding-left: 24px;
    border-left: 1px solid var(--line);
  }

  .service {
    display: flex;
    flex-wrap: wrap;
    column-gap: 24px;
    row-gap: 4px;
    align-items: baseline;
    padding: 12px;
    margin-left: -12px;
    border-bottom: 1px solid var(--line-soft);
  }

  .service:hover { background: var(--surface); }

  .service .name { min-width: 12ch; font-weight: 700; color: var(--ink); }
  .service .role { flex: 1 1 12ch; color: var(--ink-muted); }

  .service .host {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--star-ink);
  }

  /* Line icon from the design system: 24 grid, 2 px square stroke. */
  .icon {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: square;
  }

  /* --- Footer ------------------------------------------------------------- */

  footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-muted);
  }
</style>
</head>
