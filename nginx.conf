# Minimal server for a single static file.
# Runs as non-root on port 8080; TLS is handled by the reverse proxy in front.

worker_processes  auto;
pid               /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # As non-root, /var/... is not writable — send everything temporary to /tmp.
    # Together with read_only in the compose file this allows a read-only rootfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log  /dev/stdout;
    error_log   /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # text/html is always included when gzip is on and must not be repeated in
    # gzip_types — nginx warns about a duplicate MIME type otherwise.
    # This server does not serve anything else.
    gzip             on;
    gzip_min_length  256;

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;

        # CAREFUL: add_header is not inherited additively — as soon as a location
        # block sets its own add_header, ALL headers set here are dropped for that
        # block. That is why they live here and in no location block.
        #
        # The CSP pins down what the page already does: no scripts, no external
        # sources, styles inline only, images only as data: URIs (the favicon).
        # It breaks the page the moment somebody adds an external resource —
        # which is the point, because consent-free operation depends on it.
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control           "public, max-age=300" always;

        # There is exactly one page. Anything else is a typo and gets a 404.
        location = / {
            try_files /index.html =404;
        }

        location / {
            return 404;
        }
    }
}
