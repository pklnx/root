name: Image bauen und nach ghcr.io veroeffentlichen

on:
  push:
    branches:
      - main
      - claude/pklnx-landing-page-wyxg8y
    # Nur bauen, wenn sich am Image wirklich etwas aendert — eine README-Aenderung
    # braucht kein neues Image.
    paths:
      - index.html
      - nginx.conf
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v3

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 und arm64, damit dasselbe Image auf x86-Servern und auf
          # ARM-VPS laeuft, ohne dass du beim Deploy darauf achten musst.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
