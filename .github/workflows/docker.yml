name: Build and publish container image

# The container image is the only way this site ships. Every push to main
# publishes a new image to the GitHub Container Registry, which the server then
# pulls: ghcr.io/pklnx/root:latest
#
# Pull requests build the image and run the smoke test as well but do not push
# it — since there is no second deploy path, a Dockerfile that no longer builds
# has to be caught before it reaches main.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The image is pure COPY, so arm64 (typical for small VPS instances)
      # costs almost nothing to build alongside amd64. PRs build amd64 only
      # and therefore need no emulation.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # Build locally and actually run it first. An image that never ran is
      # unproven — and a broken one should not reach the registry at all.
      - name: Build test image (amd64, loadable)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pklnx-space:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container and probe it
        run: |
          set -euo pipefail
          # Same hardening the compose file promises, so CI proves it holds.
          docker run -d --name smoke \
            --read-only --tmpfs /tmp \
            -p 127.0.0.1:8080:8080 pklnx-space:test

          echo "::group::Wait for healthy"
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && { docker logs smoke; exit 1; }
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy \
            || { echo "container never became healthy"; docker logs smoke; exit 1; }
          echo "::endgroup::"

          # Running as non-root? Otherwise redirecting the paths to /tmp is pointless.
          test "$(docker exec smoke id -un)" = nginx
          echo "user: $(docker exec smoke id -un) (uid $(docker exec smoke id -u))"

          # Is what we serve byte-for-byte the file in the repo?
          curl -fsS http://127.0.0.1:8080/ -o served.html
          diff -q served.html index.html

          # The liveness endpoint the HEALTHCHECK probes.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = 200

          # The CSP has to arrive — it is what enforces the no-external-requests rule.
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:8080/
          grep -qi '^content-security-policy:.*default-src .none.' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt

          # There is exactly one page; anything else is a typo.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope)" = 404

          echo "smoke test passed"
          docker rm -f smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Only main/tags need arm64; on a PR one architecture is enough to
          # prove the image still builds.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
