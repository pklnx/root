<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pklnx</title>
<meta name="description" content="pklnx — infrastructure &amp; backend engineering">
<meta name="theme-color" content="#0a0c0b">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0c0b'/%3E%3Crect x='11' y='9' width='10' height='14' rx='1' fill='%237fb69a'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:     #0a0c0b;
    --fg:     #e4e8e5;
    --muted:  #8b938d;
    --accent: #7fb69a;

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "DejaVu Sans Mono", "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.75rem, 6vw, 5rem);
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    animation: rise .8s ease-out both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
  }

  /* Der Block sitzt im oberen Drittel; der Leerraum darunter traegt die Seite. */
  main {
    max-width: 44rem;
    margin-top: clamp(3rem, 22vh, 11rem);
  }

  h1 {
    margin: 0;
    font-size: clamp(2.25rem, 9vw, 3.5rem);
    font-weight: 500;
    letter-spacing: -.02em;
    line-height: 1.1;
  }

  /* Statischer Block-Cursor — einziger Akzent der Seite */
  .cursor {
    display: inline-block;
    width: .5em;
    height: .95em;
    margin-left: .22em;
    vertical-align: -.1em;
    background: var(--accent);
  }

  .tagline {
    margin: .85rem 0 0;
    color: var(--muted);
    font-size: clamp(.875rem, 2.6vw, 1rem);
    letter-spacing: .02em;
  }

  footer {
    color: var(--muted);
    font-size: .8125rem;
    letter-spacing: .06em;
  }
</style>
</head>
<body>

<main>
  <h1>pklnx<span class="cursor" aria-hidden="true"></span></h1>
  <p class="tagline">infrastructure &amp; backend engineering</p>
</main>

<footer>pklnx.space</footer>

</body>
</html>
