name: Build and publish container image

on:
  push:
    branches:
      - main
      - claude/pklnx-landing-page-wyxg8y
    # Only build when something that ends up in the image actually changes —
    # a README edit does not need a new image.
    paths:
      - index.html
      - nginx.conf
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      # Build locally and actually run it first. An image that never ran is
      # unproven — and a broken one should not reach the registry at all.
      - name: Build test image (amd64, loadable)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pklnx-space:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container and probe it
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 127.0.0.1:8080:8080 pklnx-space:test

          echo "::group::Wait for healthy"
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && { docker logs smoke; exit 1; }
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy \
            || { echo "container never became healthy"; docker logs smoke; exit 1; }
          echo "::endgroup::"

          # Running as non-root? Otherwise redirecting the paths to /tmp is pointless.
          test "$(docker exec smoke id -un)" = nginx
          echo "user: $(docker exec smoke id -un) (uid $(docker exec smoke id -u))"

          # Is what we serve byte-for-byte the file in the repo?
          curl -fsS http://127.0.0.1:8080/ -o served.html
          diff -q served.html index.html

          # The CSP has to arrive — it is what enforces the no-external-requests rule.
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:8080/
          grep -qi '^content-security-policy:.*default-src .none.' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt

          # There is exactly one page; anything else is a typo.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope)" = 404

          echo "smoke test passed"
          docker rm -f smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 and arm64, so the same image runs on x86 servers and on ARM
          # VPS instances without having to think about it at deploy time.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
