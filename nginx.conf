# Minimaler Server fuer eine einzige statische Datei.
# Laeuft als nicht-root auf Port 8080; TLS macht der Reverse Proxy davor.

worker_processes  auto;
pid               /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Als nicht-root ist /var/... nicht beschreibbar — alles Temporaere nach /tmp.
    # Erlaubt zusammen mit read_only im Compose-File ein schreibgeschuetztes Rootfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log  /dev/stdout;
    error_log   /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # text/html ist bei aktivem gzip immer eingeschlossen und darf nicht zusaetzlich
    # in gzip_types stehen — nginx warnt sonst ueber einen doppelten MIME-Typ.
    # Etwas anderes liefert dieser Server nicht aus.
    gzip             on;
    gzip_min_length  256;

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;

        # ACHTUNG: add_header wird nicht additiv vererbt — sobald ein location-Block
        # ein eigenes add_header setzt, fallen ALLE hier gesetzten Header fuer diesen
        # Block weg. Deshalb stehen sie ausschliesslich hier und in keinem location.
        #
        # Die CSP schreibt fest, was die Seite ohnehin tut: keine Skripte, keine
        # externen Quellen, Styles nur inline, Bilder nur als data:-URI (das Favicon).
        # Sie bricht die Seite, sobald jemand doch eine externe Ressource einbaut —
        # genau das ist hier gewollt, denn davon haengt die Consent-Freiheit ab.
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control           "public, max-age=300" always;

        # Es gibt genau eine Seite. Alles andere ist ein Tippfehler und bekommt 404.
        location = / {
            try_files /index.html =404;
        }

        location / {
            return 404;
        }
    }
}
