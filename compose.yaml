services:
  web:
    build: .
    image: ghcr.io/pklnx/hermes:latest
    container_name: pklnx-space
    restart: unless-stopped

    # Reachable on the loopback interface only — the reverse proxy on the host
    # forwards here. Without the 127.0.0.1 binding the container would sit on
    # the public interface and TLS termination could be bypassed.
    ports:
      - "127.0.0.1:8080:8080"

    # Hardening: nothing on the filesystem needs to be written at runtime.
    # nginx writes its pid and temp files to /tmp (see nginx.conf) and caches
    # to /var/cache/nginx — both live in RAM here instead of in the image.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
